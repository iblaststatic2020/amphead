name: amphead
repo: https://github.com/iblaststatic2020/amphead
sha: d58bc5334bc4bd209007c0df5ca043c36ebc30fb
title: AmpHead
description: >-
  Turns Hermes into a guitar amp head. It starts its own low-latency audio engine (one duplex
  stream on the interface, 256-frame blocks, about 16 ms round trip on a kernel-streaming
  driver), loads a captured tube amp (a .nam file made with Neural Amp Modeler) and a cabinet
  impulse, and gives you the knobs a head has: bass, mid, treble, input gain, output gain and
  master. It parks the master at -60 dB and stays in standby until you flip the Live switch,
  arms at the level it already had instead of jumping to a preset one, keeps a sound as a named rig (capture, cabinet, tone, trims and
  gate, never the master) that recalls in one press or travels as one line of text, and answers
  READY / STANDBY / PARKED / NO SIGNAL / NO CHAIN / CLIPPING / DEVICE CLOSED with the reason in a
  sentence, including the next step when a file it was handed will not load. A desktop pane is
  drawn as an amp head: the tone named from the two files on the chain, a metre, the file
  pickers, and a dead man's switch that parks the master, disarms and bypasses every stage while
  proving the input is still arriving.

  AmpHead runs one Python process of its own, the engine, in the interpreter Hermes already runs the plugin in. Its two dependencies, numpy and sounddevice, are declared in `pyproject.toml`, so a normal `hermes plugins install` asks once and installs them: that is the only install step, and there is no second interpreter to build or path to type. Hermes downloads those two pinned wheels from PyPI, pinned as numpy 2.5.4 and sounddevice 0.5.6. That single download during install is the whole project's network access. The engine opens the audio interface (exclusive kernel streaming on Windows, CoreAudio on macOS, ALSA on Linux) and keeps it open while the amp is on. It reads `.nam` captures and `.wav` cabinets from the folders named in a settings file (`%APPDATA%\amphead\settings.json` and the macOS/Linux equivalents), and writes that file only when you or your agent call `amphead_settings action=set`. `action="find"` walks Documents, Downloads, Desktop, Music and the cloud folders inside them, four levels deep, reading file names only, and runs only when a person presses the search in the pane or asks for it in chat. It remembers the last capture and cabinet in `~/.amphead2.json`, and writes `.wav` takes to a `recordings` folder beside its settings file when you press record. Once running it makes no network calls, sends no telemetry, stores no credentials, and does not launch, steer or read any other application: there is no other application. `amphead_aim` reads the same file names, nothing else: no audio is opened unless you pass `action="measure"`, which reads the two wav files you name and writes nothing. It stores one line of its own answer in `~/.amphead2.json` so the face can show what was last asked for.
maintainer: iblaststatic2020
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/iblaststatic2020/amphead#readme
version: "1.1.1"
readme: true
platforms:
  - windows
  - macos
  - linux
known_issues:
  - Tested on Windows only. The macOS and Linux paths (device selection, settings location, engine discovery) have unit tests but have not been run by the author against a real install.
  - TUNE closes and reopens the audio device several times while it measures block sizes (up to about 20 seconds, silent, chain armed at -60 dB), then leaves the amp as it found it.
  - Low latency needs an interface with a kernel-streaming or exclusive driver; on a shared WMME pair it works but feels late, and the verdict reports the round trip rather than hiding it.
  - Tone comes from captures and cabinets you own; no amp is modelled in code, and without a capture and a cabinet the path is clean with a tone stack.
  - The engine is Python: numpy and sounddevice, declared in the plugin's `pyproject.toml` and installed by `hermes plugins install` after one consent prompt. Hermes must run on Python 3.12 or newer (numpy 2.5.4's floor). `amphead_setup` names what is missing instead of failing silently.
capabilities:
  provides_tools:
    - amphead_ping
    - amphead_status
    - amphead_setup
    - amphead_teardown
    - amphead_tone
    - amphead_live
    - amphead_panic
    - amphead_ready
    - amphead_set
    - amphead_settings
    - amphead_aim
    - amphead_rig
    - amphead_record
  provides_hooks: []
  provides_middleware: []
  requires_env: []

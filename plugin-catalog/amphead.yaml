name: amphead
repo: https://github.com/iblaststatic2020/amphead
sha: b0773942f3b09fa4fbe9df1ae6a0b006194e61d6
title: AmpHead
description: >-
  Turns Hermes into a guitar amp head. It starts its own low-latency audio engine (one duplex
  stream on the interface, 256-frame blocks, about 16 ms round trip on a kernel-streaming
  driver), loads a captured tube amp (a .nam file made with Neural Amp Modeler) and a cabinet
  impulse, and gives you the knobs a head has: bass, mid, treble, input gain, output gain and
  master. It parks the master at -60 dB and stays in standby until you flip the Live switch,
  arms at a measured -6 dB, keeps a sound as a named rig (capture, cabinet, tone, trims and
  gate, never the master) that recalls in one press or travels as one line of text, and answers
  READY / STANDBY / PARKED / NO SIGNAL / NO CHAIN / CLIPPING / DEVICE CLOSED with the reason in a
  sentence, including the next step when a file it was handed will not load. A desktop pane is
  drawn as an amp head: the tone named from the two files on the chain, a metre, the file
  pickers, and a dead man's switch that parks the master, disarms and bypasses every stage while
  proving the input is still arriving.

  AmpHead runs one Python process of its own, the engine, spawned with a `python` that can import numpy and sounddevice: `.engine` beside the plugin if it is there, else `AMPHEAD_ENGINE_PYTHON` or the `engine_python` setting. The plugin never installs anything; `scripts/engine_env.ps1` builds that interpreter once with uv and pip, downloading exactly two pinned wheels (numpy 2.4.6, sounddevice 0.5.6) from PyPI, and that script is the only network access in this project. The engine opens the audio interface (exclusive kernel streaming on Windows, CoreAudio on macOS, ALSA on Linux) and keeps it open while the amp is on. It reads `.nam` captures and `.wav` cabinets from the folders named in a settings file (`%APPDATA%\amphead\settings.json` and the macOS/Linux equivalents), and writes that file only when you or your agent call `amphead_settings action=set`. `action="find"` walks Documents, Downloads, Desktop, Music and the cloud folders inside them, four levels deep, reading file names only. It remembers the last capture and cabinet in `~/.amphead2.json`, and writes `.wav` takes to a `recordings` folder beside its settings file when you press record. Once running it makes no network calls, sends no telemetry, stores no credentials, and does not launch, steer or read any other application: there is no other application. `amphead_aim` reads the same file names, nothing else: no audio is opened unless you pass `action="measure"`, which reads the two wav files you name and writes nothing. It stores one line of its own answer in `~/.amphead2.json` so the face can show what was last asked for.
maintainer: iblaststatic2020
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/iblaststatic2020/amphead#readme
version: "1.0.0"
readme: true
platforms:
  - windows
  - macos
  - linux
known_issues:
  - Tested on Windows only. The macOS and Linux paths (device selection, settings location, engine discovery) have unit tests but have not been run by the author against a real install.
  - TUNE closes and reopens the audio device several times while it measures block sizes (up to about 20 seconds, silent, chain armed at -60 dB), then leaves the amp as it found it.
  - Low latency needs an interface with a kernel-streaming or exclusive driver; on a shared WMME pair it works but feels late, and the verdict reports the round trip rather than hiding it.
  - Tone comes from captures and cabinets you own; no amp is modelled in code, and without a capture and a cabinet the path is clean with a tone stack.
  - The plugin installs nothing. It needs an interpreter that can import numpy and sounddevice: the bundled `scripts/engine_env.ps1` builds one with uv and pip (two pinned wheels from PyPI, the only network use anywhere), or point `AMPHEAD_ENGINE_PYTHON` at your own. `amphead_setup` names what is missing instead of failing silently.
capabilities:
  provides_tools:
    - amphead_ping
    - amphead_status
    - amphead_setup
    - amphead_teardown
    - amphead_tone
    - amphead_live
    - amphead_panic
    - amphead_ready
    - amphead_set
    - amphead_settings
    - amphead_aim
  provides_hooks: []
  provides_middleware: []
  requires_env: []

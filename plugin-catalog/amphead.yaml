name: amphead
repo: https://github.com/iblaststatic2020/hermes-reaper-amp
sha: ce2600729da8d4ec8b4d096cb05f991ace17b800
title: AmpHead
description: >-
  Turns a REAPER session into a guitar rig the agent can build, hold and verify: it launches the host
  minimized, makes its own project tab, loads the amp and drive, sets the knobs, then parks the
  master at -60 dB and stops in standby until the player flips the Live switch. Every write is read
  back from the plugin and compared as a number, and a tone request in plain words ("an amp that
  sounds like blink182", "I want to sound like AC/DC") resolves to a saved NAM capture plus IR and
  reports what it loaded. A desktop pane shows the live input meter, the real chain, every knob the
  plugin publishes and a READY / NO SIGNAL / CLIPPING verdict.

  AmpHead touches the machine in five ways. It runs PowerShell (`-NoProfile -ExecutionPolicy Bypass`)
  to find REAPER, launch it minimized, steer and measure its window, count running instances, and
  stop a REAPER it started itself. It installs a Lua bridge into the REAPER resource path, appending
  one line to `__startup.lua` after backing that file up, and removes both on uninstall. While
  connected it runs a long-lived background request channel over files in the Hermes data folder,
  polled at 150 ms from Python and answered by a loop inside REAPER. It reads track names, the FX
  chain, every parameter name and value the loaded plugin publishes, the master fader, and the path
  of the project it is pointed at, all from a session it did not create. It writes plugin parameters
  and the record input into its own rig tab as one undo group per action, lowers the master fader,
  and saves that tab to its own `.rpp` under the Hermes data folder. It never saves, renames or
  overwrites your song projects, never touches audio files, stores no credentials and makes no
  network calls.
maintainer: iblaststatic2020
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/iblaststatic2020/hermes-reaper-amp#readme
version: "1.0.0"
readme: true
platforms:
  - windows
  - macos
  - linux
known_issues:
  - REAPER 7 must be installed; the plugin refuses rather than guessing a path when it cannot find it.
  - No DSP and no tuner. Latency is REAPER's, reported in ms with >15 ms called out as too slow to play through.
  - Tested on Windows only. macOS and Linux take the same ReaScript bridge and their own resource paths, but have not been run by the author, and window hiding is Windows only.
  - Amp choice cannot be a parameter write on the NAM builds, so "load this capture" switches a saved REAPER FX preset and verifies the capture name by read-back.
capabilities:
  provides_tools:
    - amphead_ping
    - amphead_status
    - amphead_setup
    - amphead_teardown
    - amphead_tone
    - amphead_live
    - amphead_panic
    - amphead_ready
    - amphead_set
    - amphead_build
    - amphead_preset
    - amphead_ab
  provides_hooks: []
  provides_middleware: []
  requires_env: []

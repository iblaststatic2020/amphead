name: amphead
repo: https://github.com/iblaststatic2020/hermes-reaper-amp
sha: a10384ffaf9bba6facb8ee19bc4564dc461e7779
title: AmpHead
description: >-
  Turns Hermes into a guitar amp. It starts its own low-latency audio engine (one duplex stream on
  the interface, 512-frame blocks, about 10 ms round trip on a kernel-streaming driver), loads a NAM
  capture and a cabinet IR, and gives you the knobs a head has: bass, mid, treble, input gain,
  output gain and master. It parks the master at -60 dB and stays in standby until you flip the Live
  switch, arms at a measured -6 dB, and answers READY / STANDBY / NO SIGNAL / NO CHAIN / CLIPPING /
  DEVICE CLOSED with the reason in a sentence. A desktop pane is drawn as an amp head: the tone named
  from the two files on the chain, a metre, the file pickers, and a dead man's switch that parks the
  master, disarms and bypasses every stage while proving the input is still arriving.

  AmpHead runs one Python process of its own, the engine, in `.engine` beside the plugin. That process opens the
  audio interface (exclusive kernel streaming on Windows, CoreAudio on macOS, ALSA on Linux) and keeps
  it open while the amp is on. It reads `.nam` captures and `.wav` cabinets from the folders named in
  a settings file (`%APPDATA%\amphead\settings.json` and the macOS/Linux equivalents), and writes
  that file only when you or your agent call `amphead_settings action=set`. `action="find"` walks
  Documents, Downloads, Desktop, Music and the cloud folders inside them, four levels deep, reading
  file names only. It remembers the last capture and cabinet in `~/.amphead2.json`. It makes no
  network calls, sends no telemetry, stores no credentials, and does not launch, steer or read any
  other application: there is no other application.
maintainer: iblaststatic2020
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/iblaststatic2020/hermes-reaper-amp#readme
version: "1.0.0"
readme: true
platforms:
  - windows
  - macos
  - linux
known_issues:
  - Tested on Windows only. The macOS and Linux paths (device selection, settings location, engine discovery) have unit tests but have not been run by the author against a real install.
  - Low latency needs an interface with a kernel-streaming or exclusive driver; on a shared WMME pair it works but feels late, and the verdict reports the round trip rather than hiding it.
  - Tone comes from captures and cabinets you own; no amp is modelled in code, and without a capture and a cabinet the path is clean with a tone stack.
  - The engine's first start installs numpy and sounddevice into `.engine` beside the plugin; `amphead_setup` says what is missing rather than failing silently.
capabilities:
  provides_tools:
    - amphead_ping
    - amphead_status
    - amphead_setup
    - amphead_teardown
    - amphead_tone
    - amphead_live
    - amphead_panic
    - amphead_ready
    - amphead_set
    - amphead_settings
  provides_hooks: []
  provides_middleware: []
  requires_env: []

name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} (Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install from the pinned spec
        run: pip install -e .

      - name: Run the headless suite
        run: python -m unittest discover -s tests -v > test-output.txt 2>&1
        shell: bash

      - name: Show tail on failure
        if: failure()
        run: |
          echo "=== last 60 lines of the test log ==="
          tail -n 60 test-output.txt

      - name: Upload the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}
          path: test-output.txt
          if-no-files-found: error

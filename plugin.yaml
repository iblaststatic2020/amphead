name: amphead
version: 1.0.0
description: "Turn Hermes into a guitar amp: it starts its own low-latency audio engine, loads a NAM capture and a cabinet IR, gives you bass/mid/treble, input and output trims, and stays in standby until you flip the Live switch."
author: "@iblaststatic2020"
provides_tools:
  - amphead_ping
  - amphead_status
  - amphead_setup
  - amphead_teardown
  - amphead_tone
  - amphead_live
  - amphead_panic
  - amphead_ready
  - amphead_set
  - amphead_settings
requires_hermes: ">=0.22.0"

name: amphead
version: 1.1.7
description: "Turn Hermes into a guitar amp head: it starts its own low-latency audio engine, loads a captured tube amp and a cabinet impulse, gives you bass/mid/treble, input and output trims, and stays in standby until you flip the Live switch. It plays captures in the .nam format made with Neural Amp Modeler."
author: "@iblaststatic2020"
provides_tools:
  - amphead_ping
  - amphead_status
  - amphead_setup
  - amphead_teardown
  - amphead_tone
  - amphead_live
  - amphead_panic
  - amphead_ready
  - amphead_set
  - amphead_settings
  - amphead_aim
  - amphead_rig
  - amphead_record
requires_hermes: ">=0.22.0"

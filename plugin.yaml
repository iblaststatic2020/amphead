name: amphead
version: 0.1.0
description: "Turn a REAPER session into a guitar rig Hermes can build, hold and verify: it launches the host, makes its own tab, loads the amp and drive, then stops in standby until you flip the Live switch."
author: "@static2020"
provides_tools:
  - amphead_ping
  - amphead_status
  - amphead_setup
  - amphead_teardown
  - amphead_tone
  - amphead_live
  - amphead_panic
  - amphead_ready
  - amphead_set
  - amphead_build
  - amphead_preset
  - amphead_ab
requires_hermes: ">=0.22.0"

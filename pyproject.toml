[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["amphead*"]

[project]
name = "amphead"
version = "1.1.0"
description = "Guitar amp head for Hermes: a low-latency engine that plays Neural Amp Modeler captures."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "sounddevice==0.5.6",
]

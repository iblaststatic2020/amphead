<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AmpHead 2 · face harness</title>
    <!-- The frame the app gives a pane: the theme tokens, the app font, no page margins. The
         harness supplies them itself so the face is judged against the same variables. -->
    <style>
      /* The full token set the app hands a plugin pane, at the app's dark-theme values. The face
         only ever reads these names, so a missing one silently renders as nothing: keep this list
         in step with the app's --ui-* variables, not with whatever the face happens to use today. */
      :root {
        --ui-bg-primary: #14100e;
        --ui-bg-secondary: #1a1512;
        --ui-bg-tertiary: #211a16;
        --ui-bg-quaternary: #2a221d;
        --ui-bg-quinary: #34291f;
        --ui-text-primary: #ece5dc;
        --ui-text-secondary: #b3a89c;
        --ui-text-tertiary: #8d8378;
        --ui-text-quaternary: #6b625a;
        --ui-stroke-primary: #3a312a;
        --ui-stroke-secondary: #2a231e;
        --ui-accent: #d98b3a;
        --ui-card: #100d0b;
      }
      body {
        margin: 0;
        padding: 16px;
        background: #0d0b0a;
        color: var(--ui-text-primary);
        font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
      }
      .label {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ui-text-quaternary);
      }
      .frame {
        overflow: hidden;
        border: 1px solid var(--ui-stroke-secondary);
        border-radius: 8px;
        background: var(--ui-card);
      }
    </style>
  </head>
  <body>
    <div style="display: flex; gap: 34px; align-items: flex-start">
      <section>
        <p class="label">pane · 300px (docked right)</p>
        <div class="frame" id="pane" style="width: 300px; height: 900px"></div>
      </section>
      <section>
        <p class="label">page · 420px (/amp2)</p>
        <div class="frame" id="page" style="width: 420px; height: 900px"></div>
      </section>
      <section>
        <p class="label">status bar chip</p>
        <div id="chip" style="display: inline-flex; align-items: center; height: 22px; padding: 0 6px; border: 1px solid var(--ui-stroke-secondary); border-radius: 5px; background: var(--ui-card)"></div>
      </section>
    </div>
    <!-- The app hands a plugin `react` and `@hermes/plugin-sdk`; a browser needs them named.
         Pinned so a face that renders here renders in the app, not in some later React. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react/": "https://esm.sh/react@18.3.1/",
          "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
          "@hermes/plugin-sdk": "./sdk.js"
        }
      }
    </script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
